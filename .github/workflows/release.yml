name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for manual dry-run packaging (e.g. 0.1.0-rc.1)'
        required: false
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: ubuntu-latest
            label: linux-x64
            bundles: deb,appimage
          - os: windows-latest
            label: windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Bun package cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux webview and AppImage libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file xdg-utils
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile, verify, and archive standalone engine release
        shell: bash
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.1.0' }}
        run: bun run build:engine --verify --package-release dist-release --version "$RELEASE_VERSION"
      - name: Build Tauri desktop installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >-
          bun run --cwd apps/desktop tauri build --ci --no-sign
          --config '{"build":{"beforeBuildCommand":""}}'
          --bundles ${{ matrix.bundles }}
      - name: Collect desktop installers and generate SHA-256 checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.1.0' }}
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          clean_ver="${RELEASE_VERSION#v}"
          bundle_root="apps/desktop/src-tauri/target/release/bundle"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "$bundle_root/macos/Petrina.app/Contents/Resources/engine/petrina-engine"
            cp "$bundle_root"/dmg/*.dmg dist-release/
            tar -czf "dist-release/Petrina-${clean_ver}-${MATRIX_LABEL}.app.tar.gz" -C "$bundle_root/macos" Petrina.app
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp "$bundle_root"/deb/*.deb dist-release/
            cp "$bundle_root"/appimage/*.AppImage dist-release/
          else
            cp "$bundle_root"/msi/*.msi dist-release/
            cp "$bundle_root"/nsis/*-setup.exe dist-release/
          fi
          bun packages/engine/src/build-engine.ts --checksums-only dist-release
      - name: Upload platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: petrina-release-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Download platform artifacts and publish unified SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p collected release-assets
          gh run download "${{ github.run_id }}" --dir collected --pattern "petrina-release-*"
          find collected -type f ! -name "SHA256SUMS.txt" -exec cp {} release-assets/ \;
          bun packages/engine/src/build-engine.ts --checksums-only release-assets
          ls -lh release-assets/
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "Petrina $RELEASE_TAG" --generate-notes
          fi
