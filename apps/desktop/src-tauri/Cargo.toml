[package]
name = "petrina"
version = "0.1.0"
description = "Petrina: a desktop app that coordinates a squad of coding agents"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "petrina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
# System notifications that report clicks, and one Petrina at a time. Both from Tauri's own plugins.
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
# Already part of Tauri's build: reads what a notification is about.
serde = { version = "1", features = ["derive"] }

# Already part of Tauri's build: used only to read how tall the macOS title bar is.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSWindow"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
