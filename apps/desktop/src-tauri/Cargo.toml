[package]
name = "petrina"
version = "0.1.0"
description = "Petrina: a desktop app that coordinates a squad of coding agents"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "petrina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }

# Already part of Tauri's build: used only to read how tall the macOS title bar is.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSWindow"] }
